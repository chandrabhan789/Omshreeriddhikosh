<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Us — Omshreeriddhikosh</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,450&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0A1322;
    --gold-500:#C6992F;
    --gold-300:#E4C878;
    --ivory-50:#FAF6EC;
    --ink-900:#191510;
    --ink-700:#3A352C;
    --ink-500:#6B6455;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--ivory-50);
    color:var(--ink-900);
    display:flex;
    justify-content:center;
    padding:56px 20px;
    line-height:1.6;
  }
  .card{
    width:100%; max-width:480px; background:#fff; border:1px solid rgba(198,153,47,0.3);
    border-radius:4px; padding:40px 36px 36px;
  }
  .eyebrow{font-size:12px; letter-spacing:0.04em; color:var(--gold-500); font-weight:600; text-transform:uppercase}
  h1{font-family:'Fraunces',serif; font-weight:560; font-size:26px; color:var(--navy-950); margin-top:10px; margin-bottom:8px}
  p.sub{font-size:14px; color:var(--ink-500); margin-bottom:30px}
  label{display:block; font-size:12.5px; color:var(--ink-500); margin-bottom:6px; margin-top:18px}
  label:first-of-type{margin-top:0}
  input, textarea, select{
    width:100%; padding:11px 12px; border:1px solid #D9D2C2; border-radius:3px;
    font-size:14.5px; font-family:inherit; background:#FAF8F3; color:var(--ink-900);
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--gold-500); outline-offset:1px}
  textarea{min-height:90px; resize:vertical}
  select{appearance:auto}
  button{
    margin-top:26px; width:100%; padding:13px; border:none; border-radius:3px;
    background:var(--gold-500); color:var(--navy-950); font-size:14.5px; font-weight:600; cursor:pointer;
    font-family:inherit; transition:background .2s;
  }
  button:hover{background:var(--gold-300)}
  button:disabled{opacity:0.6; cursor:default}
  #status{margin-top:14px; font-size:13px; min-height:18px}
  #status.ok{color:#1a7a3c}
  #status.err{color:#b4232c}
  .footer-note{margin-top:28px; padding-top:18px; border-top:1px solid #EEE7D6; font-size:11.5px; color:#9b9484; line-height:1.6}
</style>
</head>
<body>

  <div class="card">
    <span class="eyebrow">Omshreeriddhikosh</span>
    <h1>Let's talk about your financial journey</h1>
    <p class="sub">Fill in your details and our team will get back to you.</p>

    <form id="contact-form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Your name" required>

      <label for="mobile">Mobile No.</label>
      <input id="mobile" name="mobile" type="tel" placeholder="9876543210 (numbers only)" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@email.com" required>

      <label for="interest">I'm interested in</label>
      <select id="interest" name="interest">
        <option>Trading Services</option>
        <option>Investment Advisory</option>
        <option>Wealth Management</option>
        <option>Financial Planning</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us a little about your goals"></textarea>

      <!-- Honeypot field: hidden from real users, bots tend to fill every field -->
      <div style="position:absolute; left:-9999px; opacity:0;" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">Send Message</button>
      <p id="status"></p>
    </form>

    <p class="footer-note">Submissions are saved directly to our internal records. We'll respond within 1–2 business days.</p>
  </div>

<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzt1ZaV6Oob7FVpsO3s-vKauXsvuksP208dTZMG7ggCsR0ZMHRV64pIGXQj_tBKWIDw/exec";
  var form = document.getElementById('contact-form');
  var btn = document.getElementById('submit-btn');
  var status = document.getElementById('status');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // Honeypot check
    if (form.website && form.website.value) {
      status.textContent = 'Message sent — thank you.';
      status.className = 'ok';
      form.reset();
      return;
    }

    // Match the backend's own validation (numeric mobile number only)
    var mobileVal = form.mobile.value.trim();
    if (!/^\d+$/.test(mobileVal)) {
      status.textContent = 'Please enter a numeric mobile number (no spaces, dashes or +).';
      status.className = 'err';
      return;
    }

    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className = '';

    var formData = new FormData(form);
    var params = new URLSearchParams();
    formData.forEach(function (value, key) { params.append(key, value); });

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // response body is opaque under no-cors; this confirms the
                        // request was sent, not that the write succeeded server-side
      body: params
    })
      .then(function () {
        status.textContent = 'Message sent — thank you! We\'ll be in touch shortly.';
        status.className = 'ok';
        form.reset();
      })
      .catch(function (err) {
        console.error('Form submission error:', err);
        status.textContent = 'Network error — please retry or contact us directly.';
        status.className = 'err';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = originalLabel;
      });
  });
</script>

</body>
</html>
